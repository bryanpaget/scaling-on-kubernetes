<style>
/* ---- Aurora theme applied across slides ---- */

/* H2 slide titles: aurora gradient underline accent */
section h2 {
  padding-bottom:8px; margin-bottom:16px;
  border-bottom:4px solid transparent;
  border-image:linear-gradient(135deg,#1de9b6 0%,#2979ff 35%,#7c4dff 70%,#64ffda 100%) 1;
}

/* H3 sub-headings get a soft aurora-blue tint */
section h3 { color:#2554c7; }

/* Footer tinted aurora blue */
section footer { color:#2979ff; font-weight:600; }

/* Blockquotes: flat callout with aurora gradient left bar */
section blockquote {
  border-left:6px solid transparent; border-image:linear-gradient(135deg,#1de9b6 0%,#2979ff 35%,#7c4dff 70%,#64ffda 100%) 1;
  background:#f3f8ff; padding:12px 18px; font-style:italic;
}

/* Tables: aurora gradient header row, flat square cells */
section table { border-collapse:collapse; }
section table th {
  background:linear-gradient(135deg,#1de9b6 0%,#2979ff 35%,#7c4dff 70%,#64ffda 100%); color:#fff; font-weight:600;
  border:1px solid #cbd8f0; text-shadow:0 1px 2px rgba(0,0,0,0.25);
}
section table td { border:1px solid #d4e4e0; }
section table tr:nth-child(even) td { background:#f3f8ff; }

/* Links in the aurora blue */
section a { color:#2979ff; }

/* Code blocks: comfortable default for short snippets, smaller for long ones.
   Long blocks are tagged .code-lg by the build (see tagCodeBlocks). Marp also
   applies downscale-only auto-scaling, so these keep code inside the slide. */
section pre { font-size:20px; line-height:1.35; }
section pre.code-lg { font-size:15px; line-height:1.3; }
section pre.code-xl { font-size:13px; line-height:1.25; }

/* ---- "How VPA Works" component flow (stack of plates) ---- */
.flow { display:flex; align-items:stretch; justify-content:center; gap:16px; margin-top:18px; }
.flow-box {
  flex:1 1 0; background:#fff;
  border:3px solid transparent; border-image:linear-gradient(135deg,#1de9b6 0%,#2979ff 35%,#7c4dff 70%,#64ffda 100%) 1;
}
.plate {
  padding:14px 16px; font-size:19px; line-height:1.3; text-align:center;
  border-bottom:1px solid #d4e4e0;
}
.plate:last-child { border-bottom:none; }
.plate-head {
  background:linear-gradient(135deg,#1de9b6 0%,#2979ff 35%,#7c4dff 70%,#64ffda 100%);
  color:#fff; font-size:24px; font-weight:bold; border-bottom:none;
  text-shadow:0 1px 2px rgba(0,0,0,0.35);
}
.flow-arrow { display:flex; align-items:center; font-size:48px; color:#2979ff; font-weight:bold; }
</style>

<h2 id="quest-ce-que-vpa">Qu'est-ce que VPA?</h2>
<p><strong>Vertical Pod Autoscaler (VPA):</strong> Ajuste automatiquement les demandes de ressources CPU et mémoire pour vos conteneurs</p>

<ul>
<li>Contrairement à HPA qui dimensionne les <em>réplicas</em>, VPA dimensionne les <em>demandes de ressources</em></li>
<li>Fonctionne avec les Deployments, StatefulSets et DaemonSets</li>
<li>Deux phases: Recommandeur (analyse) + Updateur (applique)</li>
<li>Native Kubernetes via les Custom Resource Definitions</li>
</ul>
<blockquote>
HPA répond "combien de pods?" VPA répond "combien de ressources par pod?"
</blockquote>
<p><strong>En savoir plus:</strong> <a href="https://github.com/kubernetes/autoscaler/blob/master/vertical-pod-autoscaler/README.md">VPA GitHub</a></p>

<header>Guide d'utilisation VPA - Plateforme Aurora</header>

<h2 id="pourquoi-vpa-est-important">Pourquoi VPA est important</h2>

<h3 id="le-probl%C3%A8me-des-demandes-de-ressources">Le problème des demandes de ressources:</h3>
<ul>
<li>Sur-provisionnement: 500m CPU quand 100m suffisent → capacité gaspillée</li>
<li>Sous-provisionnement: 100m CPU quand 500m sont nécessaires → limitation</li>
<li>Demandes statiques: Ne jamais ajuster après le déploiement</li>
</ul>
<h3 id="vpa-r%C3%A9sout-cela">VPA résout cela:</h3>
<ul>
<li><strong>Surveillance continue:</strong> Analyse les modèles d'utilisation au fil du temps</li>
<li><strong>Ajustement automatique:</strong> Met à jour les demandes de ressources au fil du temps</li>
<li><strong>Dimensionnement correct:</strong> Optimise l'utilisation des ressources du cluster</li>
</ul>
<blockquote>
Cesser de deviner, commencer à dimensionner avec des données.
</blockquote>

<tr>

<th>Met à jour les pods existants</th>
<th>Éjecte les pods</th>
<th>Utilisation en production</th>

<td><strong>Off</strong></td>

<td>Non</td>

</tr>

<td><strong>Initial</strong></td>
<td>Non</td>
<td>Non</td>

</tr>
<tr>
<td><strong>InPlace</strong></td>
<td>Oui (en place)</td>
<td>Non</td>
<td>Recommandé pour prod</td>
</tr>
<tr>
<td><strong>InPlaceOrRecreate</strong></td>

<td>Oui</td>
<td>Approche équilibrée</td>
</tr>
<tr>

<td>Oui</td>

</tr>

<td>Déconseillé</td>
<td>Déconseillé</td>
<td>Ne pas utiliser</td>
</tr>
</tbody>

<header>Guide d'utilisation VPA - Plateforme Aurora</header>

<h2 id="modes-vpa-recommand%C3%A9s-pour-la-production">Modes VPA recommandés pour la production</h2>

<h3 id="pour-les-workloads-en-production">Pour les workloads en production:</h3>
<ol>
<li><strong>Initial</strong> - Sécurisé, s'applique uniquement à la création du pod</li>
<li><strong>InPlace</strong> - Sans perturbation, met à jour en place quand possible</li>
</ol>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-yaml"># Mode Initial - appliquer uniquement à la création du pod
updatePolicy:
  updateMode: &quot;Initial&quot;
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-yaml"># Mode InPlace - essayer la mise à jour en place, ne pas éjecter
updatePolicy:
  updateMode: &quot;InPlace&quot;
</code></pre>
<h3 id="pour-le-d%C3%A9veloppementles-tests">Pour le développement/les tests:</h3>
<ul>
<li><strong>InPlaceOrRecreate</strong> - Équilibré, essaie d'abord en place</li>
<li><strong>Recreate</strong> - Plus agressif, éjecte et recrée</li>
</ul>
<blockquote>
<p><strong>Mise en garde :</strong> <code>InPlace</code> nécessite le feature gate <code>InPlacePodVerticalScaling</code> et une version VPA récente. Sans cela, les mises à jour recréent le pod.</p>
</blockquote>

</ol>

  resourcePolicy:
    containerPolicies:
      - containerName: &quot;*&quot;
        controlledResources: [&quot;memory&quot;]

<h2 id="cadres-de-s%C3%A9curit%C3%A9-pour-la-production">Cadres de sécurité pour la production</h2>

<h3 id="ne-pas">NE PAS:</h3>
<ol>
<li><strong>Utiliser le mode Auto</strong> - Déconseillé</li>
<li><strong>Combiner VPA avec HPA sur les mêmes ressources</strong> - Conflit inévitable</li>
<li><strong>Activer VPA pour les batch jobs</strong> - Utiliser KEDA Jobs à la place</li>
<li><strong>Définir minReplicaCount &lt; 2 avec Recreate</strong> - L'updateur par défaut est 2</li>
</ol>
<h3 id="faire">FAIRE:</h3>

</code></pre>

</code></pre>

<h2 id="validation-et-observabilit%C3%A9">Validation et observabilité</h2>

<h3 id="test-de-bout-en-bout--les-recommandations-sont-elles-appliqu%C3%A9es">Test de bout en bout : les recommandations sont-elles appliquées ?</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">kubectl rollout restart deployment/my-app
kubectl describe pod -l app=my-app   # confirmer que les demandes ont changé
</code></pre>
<h3 id="%C3%A0-surveiller-en-production">À surveiller en production :</h3>
<ul>
<li><strong>Recommandation vs demandes réelles</strong> - un écart important signale une dérive</li>
<li><strong>Nombre d'évictions</strong> (modes Recreate) - des pics signalent des perturbations</li>
<li><strong>Latence du recommandeur</strong> - recommandations périmées après un changement de charge</li>
</ul>
<blockquote>
<p>Activez le Prometheus/ServiceMonitor (désactivé par défaut) pour suivre ces signaux dans le temps.</p>
</blockquote>

<h2 id="limites--quand-ne-pas-utiliser-vpa">Limites : quand NE PAS utiliser VPA</h2>

<ul>
<li><strong>Charges en pics :</strong> VPA réagit à l'historique, les pics soudains peuvent être sous-provisionnés le temps qu'il rattrape</li>
<li><strong>Applications JVM / réglées sur le tas :</strong> changer les demandes de mémoire ne change pas <code>-Xmx</code>; dimensionnez le runtime, pas seulement le pod</li>
<li><strong>Charges sensibles aux évictions :</strong> évitez <code>Recreate</code> quand les redémarrages coûtent cher; préférez <code>Initial</code> ou <code>InPlace</code></li>
<li><strong>Jobs batch / éphémères :</strong> utilisez KEDA Jobs; VPA a besoin de temps pour observer l'utilisation</li>
<li><strong>Même ressource que HPA :</strong> ne laissez jamais les deux contrôler la même ressource (voir diapo intégration)</li>
</ul>
<blockquote>
VPA optimise les charges en régime permanent. Pour les applications en pics ou sensibles aux redémarrages, utilisez-le avec prudence ou pas du tout.
</blockquote>
