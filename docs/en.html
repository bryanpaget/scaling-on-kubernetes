/* H3 sub-headings get a soft aurora-blue tint */
section h3 { color:#2554c7; }

/* Footer tinted aurora blue */
section footer { color:#2979ff; font-weight:600; }

/* Blockquotes: flat callout with aurora gradient left bar */
section blockquote {
  border-left:6px solid transparent; border-image:linear-gradient(135deg,#1de9b6 0%,#2979ff 35%,#7c4dff 70%,#64ffda 100%) 1;
  background:#f3f8ff; padding:12px 18px; font-style:italic;
}

/* Tables: aurora gradient header row, flat square cells */
section table { border-collapse:collapse; }
section table th {
  background:linear-gradient(135deg,#1de9b6 0%,#2979ff 35%,#7c4dff 70%,#64ffda 100%); color:#fff; font-weight:600;

/* Links in the aurora blue */
section a { color:#2979ff; }

/* ---- "How VPA Works" component flow (stack of plates) ---- */
.flow { display:flex; align-items:stretch; justify-content:center; gap:16px; margin-top:18px; }
.flow-box {
  flex:1 1 0; background:#fff;
  border:3px solid transparent; border-image:linear-gradient(135deg,#1de9b6 0%,#2979ff 35%,#7c4dff 70%,#64ffda 100%) 1;
}
.plate {

  border-bottom:1px solid #d4e4e0;
}
.plate:last-child { border-bottom:none; }
.plate-head {

  text-shadow:0 1px 2px rgba(0,0,0,0.35);
}
.flow-arrow { display:flex; align-items:center; font-size:48px; color:#2979ff; font-weight:bold; }
</style>

<h2 id="executive-summary">Executive Summary</h2>

<ul>
<li><strong>What:</strong> VPA automatically adjusts CPU and memory resource requests for your containers based on actual usage patterns</li>
<li><strong>Why:</strong> Right-size resources to reduce waste and improve cluster efficiency while HPA handles replica scaling</li>
<li><strong>Risk:</strong> Low - VPA is an open-source Kubernetes-native tool with proven stability; Aurora platform just needs to adopt it</li>
<li><strong>Cost:</strong> Minimal - runs as system components, &lt;1% overhead on control plane</li>
</ul>
<blockquote>
Right-size your resources, not just your replicas.

<h2 id="what-is-vpa">What is VPA?</h2>
<p><strong>Vertical Pod Autoscaler (VPA):</strong> Automatically adjusts CPU and memory resource <em>requests</em> for your containers</p>

<ul>
<li>Unlike HPA which scales <em>replicas</em>, VPA scales <em>resource requests</em></li>
<li>Works with Deployments, StatefulSets, DaemonSets</li>
<li>Two-phase: Recommender (analyze) + Updater (apply)</li>
<li>Kubernetes-native via Custom Resource Definitions</li>
</ul>
<blockquote>
HPA scales how many, VPA scales how much.
</blockquote>
<p><strong>Learn more:</strong> <a href="https://github.com/kubernetes/autoscaler/blob/master/vertical-pod-autoscaler/README.md">VPA GitHub</a></p>

<h2 id="why-vpa-matters">Why VPA Matters</h2>

<h3 id="the-resource-request-problem">The Resource Request Problem:</h3>
<ul>
<li>Over-provisioning: 500m CPU when 100m needed → wasted capacity</li>
<li>Under-provisioning: 100m CPU when 500m needed → throttling</li>
<li>Static requests: Never adjust after deployment</li>
</ul>
<h3 id="vpa-solves-this">VPA Solves This:</h3>
<ul>
<li><strong>Continuous monitoring:</strong> Analyzes actual usage patterns</li>
<li><strong>Automatic adjustment:</strong> Updates resource requests over time</li>
<li><strong>Right-sizing:</strong> Optimizes cluster resource utilization</li>
</ul>
<blockquote>
Stop guessing, start sizing with data.
</blockquote>

<h2 id="vpa--hpa-best-practice-pattern">VPA + HPA: Best Practice Pattern</h2>

<h3 id="the-division-of-responsibility">The Division of Responsibility:</h3>
<ul>
<li><strong>HPA</strong> → Scales replicas (how many pods)</li>
<li><strong>VPA</strong> → Scales resources (how much per pod)</li>
</ul>
<h3 id="critical-use-controlledresources">Critical: Use <code>controlledResources</code></h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-yaml"># HPA manages CPU scaling (replicas)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
spec:
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

# VPA manages ONLY memory (avoid conflict)
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
spec:
  resourcePolicy:
    containerPolicies:
      - containerName: &quot;*&quot;
        controlledResources: [&quot;memory&quot;]
</code></pre>

<h2 id="production-guardrails">Production Guardrails</h2>

<h3 id="do-not">DO NOT:</h3>
<ol>
<li><strong>Use Auto mode</strong> - Deprecated</li>
<li><strong>Combine VPA with HPA on same resources</strong> - Conflict inevitable</li>
<li><strong>Enable VPA for batch jobs</strong> - Use KEDA Jobs instead</li>
<li><strong>Set minReplicaCount &lt; 2 with Recreate</strong> - Updater defaults to 2</li>
</ol>
<h3 id="do">DO:</h3>
<ol>
<li><strong>Use Initial or InPlace mode</strong> - Minimize disruption</li>
<li><strong>Set controlledResources</strong> - Avoid HPA/VPA conflicts</li>
<li><strong>Monitor recommendations</strong> - Check VPA status weekly</li>
<li><strong>Use resource policy limits</strong> - Define min/max bounds</li>
</ol>

<h2 id="appendix-vpa-modes-detail">Appendix: VPA Modes Detail</h2>

<h3 id="update-mode-comparison">Update Mode Comparison:</h3>
<table>
<thead>
<tr>
<th>Mode</th>
<th>Updates</th>
<th>Evicts</th>
<th>Pod Disruption</th>
<th>Use Case</th>
</tr>
</thead>
<tbody>
<tr>
<td>Off</td>
<td>No</td>
<td>No</td>
<td>None</td>
<td>Analysis only</td>
</tr>
<tr>
<td>Initial</td>
<td>No</td>
<td>No</td>
<td>None</td>
<td>Production-safe</td>
</tr>
<tr>
<td>InPlace</td>
<td>Yes</td>
<td>No</td>
<td>Minimal</td>
<td>Production-safe</td>
</tr>
<tr>
<td>InPlaceOrRecreate</td>
<td>Yes</td>
<td>Yes (fallback)</td>
<td>Some</td>
<td>Dev/testing</td>
</tr>
<tr>
<td>Recreate</td>
<td>Yes</td>
<td>Yes</td>
<td>High</td>
<td>Last resort</td>
</tr>
<tr>
<td>Auto</td>
<td>Deprecated</td>
<td>Deprecated</td>
<td>N/A</td>
<td>Do not use</td>
</tr>
</tbody>
</table>
<h3 id="when-to-use-each">When to Use Each:</h3>
<ul>
<li><strong>Initial:</strong> Production, workloads with frequent restarts</li>
<li><strong>InPlace:</strong> Production, workloads where disruption must be avoided</li>
<li><strong>InPlaceOrRecreate:</strong> Dev/testing, when you need updates quickly</li>
<li><strong>Recreate:</strong> Emergency, when other modes fail</li>
</ul>
