name: Build Presentation PDFs

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup marp-cli
        uses: hyvoro/actions-setup-marp-cli@v2
        with:
          marp-cli-version: latest
          node-version: 20

      - name: Build PDFs using Makefile
        run: make pdf

      - name: Upload English PDF
        uses: actions/upload-artifact@v4
        with:
          name: vpa-presentation-en
          path: vpa-presentation-en.pdf

      - name: Upload French PDF
        uses: actions/upload-artifact@v4
        with:
          name: vpa-presentation-fr
          path: vpa-presentation-fr.pdf

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            vpa-presentation-en.pdf
            vpa-presentation-fr.pdf
