name: Build and Deploy Marp Presentation

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'config/**'
      - 'img/**'
      - 'Makefile'
      - 'postprocess.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/marp-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'content/**'
      - 'config/**'
      - 'img/**'
      - 'Makefile'
      - 'postprocess.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/marp-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium --no-install-recommends

      - name: Build HTML presentation
        run: make html

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: github-pages-site
          path: docs/

      - name: Commit generated site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if ! git diff --cached --quiet; then
            git commit -m "chore: rebuild GitHub Pages site [skip ci]" -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
            git push origin HEAD:main
          fi

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: false
