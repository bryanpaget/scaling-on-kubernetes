name: Build and Deploy Marp Presentation

on:
  push:
    branches: [main]
    paths:
      - 'content/*.md'
      - 'config/*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup marp-cli
        uses: hyvoro/actions-setup-marp-cli@v2
        with:
          marp-cli-version: latest
          node-version: 20

      - name: Build HTML presentation
        run: |
          make html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: false
